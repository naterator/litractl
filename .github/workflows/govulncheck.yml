name: Vulnerability Check

# Also run on main and weekly: new advisories can affect unchanged code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      # The action checks out the repository and installs the latest stable Go.
      - name: Check for Vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          cache-dependency-path: go.sum
